# JUnit 5 execution configuration
# Default per-test timeout: 60s
junit.jupiter.execution.timeout.default=60s
junit.jupiter.execution.timeout.mode.enabled=true

# Parallel execution is DISABLED because the test suite has pervasive global-state
# dependencies (TaskManager singleton, Runner singleton, static LogManager config,
# Mockito inline mock maker, port bindings) that cause cross-class interference under
# concurrent class execution. Enabling parallelism would require annotating every
# stateful test class with @Execution(SAME_THREAD) or @ResourceLock, which is not
# feasible across 2000+ test files.
#
# Runtime optimization is instead achieved through:
# 1. Reducing Thread.sleep durations in test code (see individual test file changes)
# 2. Replacing blocking sleeps with CountDownLatch.await() where cancellation is expected
# 3. Single-fork JVM reuse (no per-class JVM startup overhead)
#
# To experiment with parallel execution in the future, uncomment the lines below and
# add @Isolated annotations to stateful test classes:
# junit.jupiter.execution.parallel.enabled=true
# junit.jupiter.execution.parallel.mode.default=same_thread
# junit.jupiter.execution.parallel.mode.classes.default=concurrent
# junit.jupiter.execution.parallel.config.strategy=dynamic
# junit.jupiter.execution.parallel.config.dynamic.factor=1.0
