# Replace evolver.example.com and the certificate paths before installing this file.
server {
    listen 80;
    listen [::]:80;
    server_name evolver.example.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name evolver.example.com;

    ssl_certificate /etc/letsencrypt/live/evolver.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/evolver.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 1m;

    access_log /var/log/nginx/gitcode-issue-evolver.access.log;
    error_log /var/log/nginx/gitcode-issue-evolver.error.log;

    location = /webhooks/gitcode {
        limit_except POST {
            deny all;
        }

        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location = /health/ready {
        limit_except GET {
            deny all;
        }

        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
    }

    location / {
        return 404;
    }
}
