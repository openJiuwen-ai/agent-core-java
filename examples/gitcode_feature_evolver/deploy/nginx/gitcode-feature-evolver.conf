server {
    listen 443 ssl http2;
    server_name feature-evolver.example.com;

    ssl_certificate /etc/letsencrypt/live/feature-evolver.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/feature-evolver.example.com/privkey.pem;

    client_max_body_size 1m;

    location = /webhooks/gitcode {
        limit_except POST {
            deny all;
        }
        proxy_pass http://127.0.0.1:8082/webhooks/gitcode;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /health/ready {
        limit_except GET {
            deny all;
        }
        proxy_pass http://127.0.0.1:8082/health/ready;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}
